name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Validate SKILL.md frontmatter and YAML files
        run: |
          python - <<'EOF'
          import sys, glob, os, re, yaml

          errors = []

          # 1) Every SKILL.md must have parseable YAML frontmatter with name + description.
          for path in sorted(glob.glob("**/SKILL.md", recursive=True)):
              with open(path, encoding="utf-8") as f:
                  text = f.read()
              if not text.startswith("---"):
                  errors.append(f"{path}: missing frontmatter (no leading ---)")
                  continue
              m = re.match(r"^---\s*\n(.*?)\n---\s*\n", text, re.DOTALL)
              if not m:
                  errors.append(f"{path}: unterminated frontmatter")
                  continue
              try:
                  data = yaml.safe_load(m.group(1))
              except yaml.YAMLError as e:
                  errors.append(f"{path}: YAML parse error -> {e}")
                  continue
              if not isinstance(data, dict):
                  errors.append(f"{path}: frontmatter is not a mapping")
                  continue
              for key in ("name", "description"):
                  if key not in data:
                      errors.append(f"{path}: missing required key '{key}'")
                  elif not isinstance(data[key], str):
                      errors.append(f"{path}: '{key}' must be a string")

          # 2) Every *.yaml / *.yml must parse (adapters, INDEX, configs).
          for path in sorted(glob.glob("**/*.yaml", recursive=True) + glob.glob("**/*.yml", recursive=True)):
              try:
                  with open(path, encoding="utf-8") as f:
                      yaml.safe_load(f)
              except yaml.YAMLError as e:
                  errors.append(f"{path}: YAML parse error -> {e}")

          # 3) INDEX.yaml must register every SKILL.md directory.
          index_path = "meta/distributor/INDEX.yaml"
          if os.path.exists(index_path):
              with open(index_path, encoding="utf-8") as f:
                  index = yaml.safe_load(f) or {}
              registered = set()
              for entry in (index.get("skills") or []):
                  if isinstance(entry, dict):
                      skill_ref = entry.get("path") or entry.get("id")
                      if skill_ref:
                          registered.add(skill_ref)
              for path in sorted(glob.glob("**/SKILL.md", recursive=True)):
                  skill_id = os.path.dirname(path).replace("\\", "/")
                  if skill_id not in registered:
                      errors.append(f"{path}: not registered in INDEX.yaml (id '{skill_id}')")

          if errors:
              print("VALIDATION FAILED:")
              for e in errors:
                  print("  -", e)
              sys.exit(1)
          print(f"OK: {len(glob.glob('**/SKILL.md', recursive=True))} SKILL.md validated, all YAML clean.")
          EOF

  route-precision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Test routing precision
        run: python meta/distributor/scripts/score.py --test tests/fixtures/route-cases.yaml
