# Adapter: MY_SKILL → WorkBuddy
# Per-platform translation rules applied by `installer sync`.
# Core fields (name, description) pass through unchanged per ADR-0002.

platform: workbuddy
install_dir: .workbuddy/skills/<skill-name>/

core_fields:
  name: as-is
  description: as-is

extension_fields:
  risk_level:
    native: false
    transform: append to `description` as trailing tag "[risk=low|mid|high]"
  verifiable:
    native: false
    transform: document inside SKILL.md body under "## Verification"
  category:
    native: true
    target: metadata.category
  user_invocable_false:
    native: true
    target: disable-model-invocation: true      # WorkBuddy native field
  always_active:
    note: achieved by user-invocable:false + session injection of distributor

horizontal_layer:
  note: >
    thinking-first / caveman / grill-with-docs / review are user-invocable:false
    and force-triggered by distributor; they cannot be /slash-called.
  field: disable-model-invocation: true
