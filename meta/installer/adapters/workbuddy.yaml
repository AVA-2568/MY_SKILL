# Adapter: MY_SKILL → WorkBuddy
# Per-platform translation rules applied by `installer sync`.
# Core fields (name, description) pass through unchanged per ADR-0002.

platform: workbuddy
install_dir: .workbuddy/skills/<skill-name>/

core_fields:
  name: as-is
  description: as-is

extension_fields:
  risk_level:
    native: false
    transform: append to `description` as trailing tag "[risk=low|mid|high]"
  verifiable:
    native: false
    transform: document inside SKILL.md body under "## Verification"
  category:
    native: true
    target: metadata.category
  user-invocable-false:
    native: true
    note: "保留 user-invocable 原样；不要转 disable-model-invocation（会让内部技能失活）"
  always_active:
    note: achieved by user-invocable:false + session injection of distributor

horizontal_layer:
  note: >
    review is user-invocable:false and force-triggered by distributor;
    it cannot be /slash-called. (v0.1 also had thinking-first / caveman /
    grill-with-docs — removed in v0.2; see ADR-0008.)
  field: "user-invocable: false"
