# Adapter: MY_SKILL → Codex (OpenAI)
# Per-platform translation rules applied by `installer sync`.
# Core fields (name, description) pass through unchanged per ADR-0002.

platform: codex
install_dir: ~/.codex/skills/<skill-name>/

core_fields:
  name: as-is
  description: as-is

extension_fields:
  risk_level:
    native: false
    transform: append to `description` as trailing tag "[risk=low|mid|high]"
  verifiable:
    native: false
    transform: document inside SKILL.md body under "## Verification"
  category:
    native: true
    target: metadata.category
  user_invocable_false:
    native: true
    target: "disable-model-invocation: true"      # Codex native field
  always_active:
    note: achieved by disable-model-invocation:true + session injection of distributor

horizontal_layer:
  field: "disable-model-invocation: true"
