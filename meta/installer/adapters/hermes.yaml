# Adapter: MY_SKILL → Hermes
# Per-platform translation rules applied by `installer sync`.
# Core fields (name, description) pass through unchanged per ADR-0002.

platform: hermes
install_dir: ~/.hermes/skills/<skill-name>/

core_fields:
  name: as-is
  description: as-is

extension_fields:
  risk_level:
    native: false
    transform: append to `description` as trailing tag "[risk=low|mid|high]"
  verifiable:
    native: false
    transform: document inside SKILL.md body under "## Verification"
  category:
    native: true
    target: metadata.hermes.tags
  user-invocable-false:
    native: false
    transform: enforce via description ("Do not invoke unless called by distributor") + rely on orchestrator gating
  always_active:
    note: achieved by description constraint + session injection of distributor

horizontal_layer:
  note: >
    Hermes has no native user-invocable flag. Horizontal components must be
    gated by the orchestrator/distributor; encode the constraint in description.
