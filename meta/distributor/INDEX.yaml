# === Routing configuration ===

routing:
  match_threshold: 50          # composite score below this triggers gap-detect
  risk_penalty:
    low: 0
    mid: -10
    high: -30

# === Lifecycle governance (Review's per-skill scope) ===

lifecycle:
  stale_after_days: 180        # 6 months → re-review
  overlap_threshold: 0.8      # 80% description match → recommend merge
  retire_after_zero_usage_days: 90   # 3 months → retire candidate
