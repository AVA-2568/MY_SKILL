routing:
  match_threshold: 50
  risk_penalty:
    low: 0
    mid: -10
    high: -30   # reserved tier: no seed currently uses it. For extreme-risk skills
                # (e.g. destructive ops). The -30 penalty is strong by design — only
                # assign `high` when a clearly-matched skill must still be demoted;
                # do NOT use it on broadly-matched skills (e.g. execute-*) or gap
                # detection will fire on every invocation.
lifecycle:
  stale_after_days: 180
  overlap_threshold: 0.8
  retire_after_zero_usage_days: 90
